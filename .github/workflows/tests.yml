name: tests

on:
  push:
    # A release tag points at a commit already tested on main. Running the
    # complete Windows dependency install again creates duplicate, occasionally
    # flaky status entries without testing different code.
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: solomonvoice-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Show selected interpreter
        run: |
          python --version
          python -c "import sys; print(sys.executable)"
      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel
      - name: Install CPU PyTorch
        run: python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
      - name: Install SolomonVoice and test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Import application and Whisper
        run: python -c "import main, whisper"
      - name: Verify model installer CLI
        run: python install_model.py --help
      - name: Run tests
        run: python -m pytest -q --basetemp=.pytest-tmp
